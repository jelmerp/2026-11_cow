<section id="$idprefix$title-slide" class="title-slide-custom"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <div class="title-slide-text">
    <h1 class="title">$title$</h1>
$if(subtitle)$
    <p class="subtitle"><span class="title-slide-prompt" aria-hidden="true">&gt;</span> $subtitle$<span class="title-slide-cursor" aria-hidden="true"></span></p>
$endif$
    <hr class="title-slide-rule">
    <div class="title-slide-byline">
$for(author)$
      <p class="author">$author$</p>
$endfor$
$for(institute)$
      <p class="institute">$institute$</p>
$endfor$
      <p class="date">$if(venue)$$venue$$if(date)$ &middot; $endif$$endif$$date$</p>
    </div>
  </div>
  <img src="img/CFAES-Horiz-RGBHEX.svg" alt="CFAES, The Ohio State University" class="title-slide-logo">
</section>
